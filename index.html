<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="css/style.css">
    <script defer src="js/script.js"></script>
</head>
<body>
    <div id="display">
        <!-- <em id="error">this is an error</em> -->
        <h2 id="main">0</h2>
    </div>
    <div id="buttons">
        <button id="7" class="button digits">7</button>
        <button id="8" class="button digits">8</button>
        <button id="9" class="button digits">9</button>
        <button id="clear" class="button">C</button>
        <button id="4" class="button digits">4</button>
        <button id="5" class="button digits">5</button>
        <button id="6" class="button digits">6</button>
        <button id="/" class="button operator">/</button>
        <button id="1" class="button digits">1</button>
        <button id="2" class="button digits">2</button>
        <button id="3" class="button digits">3</button>
        <button id="*" class="button operator">x</button>
        <button id="0" class="button digits">0</button>
        <button id="=" class="button">=</button>
        <button id="+" class="button operator">+</button>
        <button id="-" class="button operator">-</button>
    </div>
</body>
</html>
